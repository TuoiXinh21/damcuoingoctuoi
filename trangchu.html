<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đám Cưới Ngọc Tươi</title>
    <link rel="stylesheet" href="trangchu.css">
</head>
<body>
    <!-- =========================================================
     MÀN HÌNH MỞ THIỆP
========================================================= -->

<div class="wedding-cover-screen" id="weddingCover">

    <div class="cover-card">

        <!-- HOA BÊN TRÁI -->
        <div class="cover-flower cover-flower-left">
            <img
                src="anhcuoi/flower2-decoration.png"
                alt=""
            >
        </div>

        <!-- HOA BÊN PHẢI -->
        <div class="cover-flower cover-flower-right">
            <img
                src="anhcuoi/flower2-decoration.png"
                alt=""
            >
        </div>


        <!-- NÚT TRÁI TIM -->
        <div class="cover-heart">
            ♥
        </div>


        <!-- TÊN -->
        <div class="cover-names">
            <div>Xuân Ngọc</div>

            <span>&amp;</span>

            <div>Hồng Tươi</div>
        </div>


        <!-- ĐƯỜNG KẺ -->
        <div class="cover-line">
            <span></span>
            <i></i>
            <span></span>
        </div>


        <!-- NGÀY -->
        <div class="cover-date">
            25 tháng 10, 2026
        </div>


        <!-- THÂN MỜI -->git add .
        <div class="cover-invite">
            Thân Mời
        </div>


        <!-- NÚT MỞ THIỆP -->
        <button onclick="window.location.href='index.html'"
            type="button"
            class="cover-open"
            id="openWedding">
            Mở thiệp
        </button>

    </div>

</div>
<script src="index.js"></script>
</body>
</html>
